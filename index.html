<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Impostor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap');
    </style>
</head>
<body>
    
    <main>
        <h1 class="main-title">
            <span class="title-primary">Impostor</span>
            <span class="title-secondary">Game</span>
        </h1>

        <div class="container" id="mainContainer">
            

            <button id="addPlayerbtn" style="margin-bottom: 1.5rem;">Add Player</button>

            <p class="error-message hidden">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"/></svg> 
                    <b>Fill in the blank fields</b>
                </span>
                <button class="close-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"/></svg></button>
            </p>

            <div class="impostor-checkbox" style="opacity: 0.5;">
                <input type="checkbox" id="twoImpostors" disabled>
                <label for="twoImpostors">
                    2 Impostors 
                    <span class="min-players">(min 6 players)</span>
                </label>
            </div>

            <div class="player">
                <label for="player1">Player 1</label>
                <input type="text" id="player1">
            </div>

            <div class="player">
                <label for="player2">Player 2</label>
                <input type="text" id="player2">
            </div>

            <div class="player">
                <label for="player3">Player 3</label>
                <input type="text" id="player3">
            </div>

            <button id="startbtn">Start</button>

        </div>

        <div class="container" id="gameContainer" hidden>
            <button id="nextbtn">Next</button>
            <h2></h2>
            <button class="reveal">Reveal</button>
            <img src="" hidden>
            <p hidden></p>
        </div>

    </main>
