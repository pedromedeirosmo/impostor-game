<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Impostor</title>
</head>
<body>
    <h1>Impostor Game</h1>

    <div class="container" id="mainContainer">
        

        <button id="addPlayerbtn" style="margin-bottom: 1.5rem;">Add Player</button>

        <p class="error-message hidden"><span>⚠</span> <b style="display: contents;">Fill in the blank fields</b><button class="close-btn">x</button></p>

        <div class="player">
            <label for="player1">Player 1</label>
            <input type="text" id="player1">
        </div>

        <div class="player">
            <label for="player2">Player 2</label>
            <input type="text" id="player2">
        </div>

        <div class="player">
            <label for="player3">Player 3</label>
            <input type="text" id="player3">
        </div>
        <button id="startbtn">Start</button>
    </div>

    <div class="container" id="gameContainer" hidden>
        <button id="nextbtn">Next</button>
        <h2></h2>
        <button class="reveal">Reveal</button>
        <p hidden></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
